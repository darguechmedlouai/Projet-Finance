<header>
  <img src="logo.png" alt="Logo">

<div class="container">

  <div class="card">
    <h2>Entrées</h2>

    <label>Valeur nominale (DT)</label>
    <input type="number" id="nominal" value="10000">

    <label>Taux d'escompte (%)</label>
    <input type="number" id="tauxEsc" value="7">

    <label>Durée (jours)</label>
    <input type="number" id="joursEsc" value="60">

    <label>Commission (DT)</label>
    <input type="number" id="commEsc" value="15">

    <label>TVA (%)</label>
    <input type="number" id="tvaEsc" value="19">

    <button onclick="calculEscompte()">Calculer Escompte</button>

    <div class="result-box" id="resultEscompte">Résultat : ...</div>
  </div>

</div>
