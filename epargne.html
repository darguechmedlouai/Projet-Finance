<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">

  <!-- jsPDF library -->

</head>
<body>

<header>
  <img src="logo.png" alt="Logo">
  <h1>Module Compte Épargne (Avancé)</h1>
  <p>Gestion Dépôts / Retraits / Charges / Crédit + Export PDF</p>
</header>

<nav>
  <a href="index.html">Accueil</a>
  <a href="epargne.html">Compte Épargne</a>

  <a href="escompte.html">Escompte</a>

<div class="container">

  <div class="card">
    <h2>Informations générales</h2>

    <label>Solde initial (DT)</label>
    <input type="number" id="soldeInitial" value="1000">

    <label>Taux annuel (%)</label>
    <input type="number" id="tauxEpargne" value="5">

    <label>Durée en jours (pour intérêts simples)</label>
    <input type="number" id="joursEpargne" value="90">

    <button onclick="ajouterOperation()">➕ Ajouter une opération</button>
  </div>

  <div class="card">
    <h2>Liste des opérations</h2>

    <table id="tableOps">
      <thead>
        <tr>
          <th>Date</th>
          <th>Type</th>
          <th>Montant (DT)</th>
          <th>Solde après opération</th>
          <th>Supprimer</th>
        </tr>
      </thead>
      <tbody>
        <!-- Operations ajoutées ici -->
      </tbody>
    </table>

    <button onclick="calculerBilanEpargne()">📊 Calculer Bilan</button>
    <button onclick="exporterPDFEpargne()">📄 Télécharger PDF</button>

    <div class="result-box" id="resultBilan">
      Bilan : ...
    </div>
  </div>

</div>

<footer>
  Finance Bank Simulator © 2026
</footer>
