<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compte Épargne</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <img src="logo.png" alt="Logo">
  <h1>Module Compte Épargne</h1>
  <p>Calcul des intérêts simples sur un compte d’épargne</p>
</header>

<nav>
  <a href="index.html">Accueil</a>
  <a href="epargne.html">Compte Épargne</a>
  <a href="decouvert.html">Découvert</a>
  <a href="escompte.html">Escompte</a>
  <a href="annuites.html">Annuités</a>
</nav>

<div class="container">

  <div class="card">
    <h2>Entrées</h2>

    <label>Capital initial (DT)</label>
    <input type="number" id="capital" value="500">

    <label>Taux annuel (%)</label>
    <input type="number" id="taux" value="5">

    <label>Nombre de jours</label>
    <input type="number" id="jours" value="90">

    <label>Base (360 ou 365)</label>
    <select id="base">
      <option value="360">360</option>
      <option value="365">365</option>
    </select>

    <button onclick="calculEpargne()">Calculer</button>

    <div class="result-box" id="resultEpargne">Résultat : ...</div>
  </div>

</div>

<footer>
  Finance Bank Simulator © 2026
</footer>

<script src="script.js"></script>
</body>
</html>
